name: LC Runner Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
        run: python scanner.py

      - name: Commit updated state files
        run: |
          git config user.name "lc-scanner-bot"
          git config user.email "actions@github.com"
          git add watchlist.json seen.json || true
          git diff --cached --quiet || git commit -m "Update scanner state"
          git push || true
